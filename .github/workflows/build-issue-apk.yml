name: 打包发码器APK

# 官方 kivy/buildozer 容器。发码器与主 App 共用同一套构建链路，
# 只是 package.name 不同（bzqissue vs baozupo），两者可并存于同一台手机。
on:
  workflow_dispatch:
  push:
    branches: [ issue-apk ]

jobs:
  build-issue-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    container:
      image: kivy/buildozer:latest
      options: --user root

    defaults:
      run:
        working-directory: issue

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      # 与主 App 相同的 keystore 策略：Actions cache 持久化，
      # 首次 keytool 生成，之后每次复用同一份证书（两边同 key，签名一致）。
      - name: 恢复签名 keystore
        uses: actions/cache@v4
        with:
          path: issue/.signing
          key: baozupo-signing-keystore-v1

      - name: 若无则生成 keystore
        run: |
          set -e
          mkdir -p .signing
          if [ ! -f .signing/app.keystore ]; then
            echo "首次运行：生成 keystore"
            keytool -genkeypair -v -keystore .signing/app.keystore -storetype PKCS12 \
              -storepass baozupo2026 -keypass baozupo2026 -alias baozupo \
              -keyalg RSA -keysize 2048 -validity 18250 \
              -dname "CN=Baozupo Issue, OU=Rental, O=Baozupo, L=Guangzhou, ST=GD, C=CN"
          fi
          keytool -list -v -keystore .signing/app.keystore -storepass baozupo2026 \
            -alias baozupo | grep -E 'SHA1:' || true

      - name: 借用主 App 的中文字体（避免仓库里塞两份 13MB 字体）
        run: |
          set -e
          mkdir -p fonts
          if [ ! -f fonts/simhei.ttf ]; then
            cp ../fonts/simhei.ttf fonts/simhei.ttf
          fi
          ls -l fonts/

      - name: 缓存 buildozer 环境
        uses: actions/cache@v4
        with:
          path: |
            /github/home/.buildozer
            /github/home/.gradle
            /root/.buildozer
            .buildozer
          key: buildozer-issue-${{ hashFiles('issue/buildozer.spec') }}

      - name: 定位 buildozer / p4a
        run: |
          set -e
          bz=$(command -v buildozer || find / -name buildozer -type f 2>/dev/null | head -1)
          echo "buildozer at: $bz"
          "$bz" --version || true
          echo "NDK dirs:"; ls -d /github/home/.buildozer/android/platform/android-ndk-* 2>/dev/null || true

      - name: 清理 p4a 产物并打包
        run: |
          set -e
          # 清除本机 Windows 路径行，使用容器内置的 SDK/NDK/JDK。
          # 少了这一步，buildozer 会去找 C:/Users/L540/... 而直接失败。
          python3 - <<'PY'
          import re
          p='buildozer.spec'
          s=open(p,encoding='utf-8').read()
          for key in ['android.sdk_path','android.ndk_path','java.home']:
              s=re.sub(r'(?m)^\s*'+re.escape(key)+r'.*\n','',s)
          open(p,'w',encoding='utf-8').write(s)
          print('已清除本地路径行，使用容器内置 SDK/NDK')
          PY
          rm -rf .buildozer/android/platform/build .buildozer/android/platform/build-*
          grep -E '^android\.(ndk|api|minapi|archs)' buildozer.spec || true
          set +o pipefail
          set +e
          yes | buildozer -v android debug 2>&1 | tee build.log
          echo "--- bin 目录内容 ---"
          ls -l bin/ || true

      - name: zipalign + 签名（否则手机报「未签名，无法安装」）
        run: |
          set +e
          ZIPALIGN=$(find /github/home /root /opt /usr/local -maxdepth 8 -type f -name zipalign \
                     -path '*/build-tools/*' 2>/dev/null | sort | tail -1)
          echo "zipalign -> [$ZIPALIGN]"
          if [ -z "$ZIPALIGN" ]; then
            echo "::warning::找不到 zipalign/apksigner，本轮 APK 仍未签名"
          else
            BT=$(dirname "$ZIPALIGN")
            for a in bin/*.apk; do
              b=$(basename "$a" .apk)
              "$BT/zipalign" -p -f 4 "$a" "${b}_al.apk"
              if [ -f "$BT/apksigner" ]; then
                "$BT/apksigner" sign --ks .signing/app.keystore --ks-pass pass:baozupo2026 \
                  --key-pass pass:baozupo2026 --ks-key-alias baozupo --out "${b}_sg.apk" "${b}_al.apk"
                "$BT/apksigner" verify --print-certs "${b}_sg.apk"
              else
                java -cp "$BT/lib/apksigner.jar" com.android.apksigner.ApkSignerTool sign \
                  --ks .signing/app.keystore --ks-pass pass:baozupo2026 \
                  --key-pass pass:baozupo2026 --ks-key-alias baozupo --out "${b}_sg.apk" "${b}_al.apk"
                java -cp "$BT/lib/apksigner.jar" com.android.apksigner.ApkSignerTool verify --print-certs "${b}_sg.apk"
              fi
              mv -f "${b}_sg.apk" "$a"
              rm -f "${b}_al.apk"
            done
            echo "--- 签名后 ---"
            ls -lh bin/
          fi

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: bzq-issue-apk
          path: issue/bin/*.apk
          if-no-files-found: error
          retention-days: 30
